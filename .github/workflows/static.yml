<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>臨床技能課程報名</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20stroke%3D%22%235e8a6a%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M14%209v15a8%208%200%200%200%2016%200V9%22/%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%227%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%227%22%20r%3D%222%22/%3E%3Cpath%20d%3D%22M22%2032v8a12%2012%200%200%200%2024%200v-6%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2228%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2228%22%20r%3D%221.8%22%20fill%3D%22%235e8a6a%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:45,45,42;--g:94,138,106;--bg:#f6f4ee;--card:#f6f4ee;--tx:rgb(var(--ink));--sub:rgba(var(--ink),.58);--ln:rgba(var(--ink),.22);--ac:rgb(var(--g));--ac2:rgba(var(--g),.55);--acx:#f6f4ee;--bad:rgb(var(--ink));--ok:rgb(var(--g));--warn:rgb(var(--ink));--chip:rgba(var(--g),.14);--serif:"Times New Roman",Times,"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:236,233,225;--g:147,184,156;--bg:#1b1d1a;--card:#1b1d1a;--acx:#1b1d1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:700 15px/1.75 "Times New Roman",Times,"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:12px 20px 64px}
.hero{position:relative;padding:34px 2px 22px;border-bottom:2px solid var(--ln)}
.mark{position:absolute;right:2px;top:28px;width:66px;height:66px;border:2px solid var(--ac2);border-radius:50%;padding:13px;color:var(--ac)}
.mark svg{width:100%;height:100%;display:block}
.ttl svg{width:22px;height:22px;vertical-align:-4px;margin-right:8px;color:var(--ac)}
.hero .en{font-size:11px;letter-spacing:.32em;color:var(--ac);text-transform:uppercase}
.hero h1{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.14em;margin:8px 0 6px;color:var(--tx)}
.hero p{margin:0;color:var(--sub);font-size:13px;letter-spacing:.08em}
.pills{display:flex;gap:36px;margin-top:22px}
.pill{display:flex;flex-direction:column;font-size:11px;color:var(--sub);letter-spacing:.2em}
.pill b{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ac);letter-spacing:0;line-height:1.2}
.tabs{display:flex;gap:30px;border-bottom:2px solid var(--ln);margin:0 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:none;background:none;color:var(--sub);border:0;border-radius:0;padding:16px 2px 12px;font-weight:700;letter-spacing:.16em;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:4px;padding:22px 20px;margin:16px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;letter-spacing:.08em}
h3{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 10px;letter-spacing:.08em}
.meta{font-size:13px;color:var(--sub);margin:4px 0}
.dl{display:grid;grid-template-columns:3.6em 1fr;gap:6px 12px;font-size:14px;margin:16px 0 4px}
.dl dt{color:var(--sub);font-size:12px;letter-spacing:.2em;padding-top:2px}
.dl dd{margin:0}
.chip{font-size:11px;padding:2px 10px;border-radius:2px;border:2px solid var(--ln);white-space:nowrap;letter-spacing:.12em;color:var(--sub)}
.chip.ok{color:var(--ok);border-color:var(--ac2);background:var(--chip)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.lv{display:inline-block;font-size:12px;border:2px solid var(--ac2);color:var(--ac);border-radius:2px;padding:0 8px;margin-right:6px;letter-spacing:.08em}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .6s ease}
.bar.full i{background:var(--ac)}
.cnt{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;letter-spacing:.1em}
button{font:inherit;border:2px solid var(--ac);border-radius:3px;padding:12px 18px;background:var(--ac);color:var(--acx);cursor:pointer;font-weight:700;letter-spacing:.18em;transition:opacity .15s}
button:hover{opacity:.88}button:disabled{opacity:.45;cursor:default}
.blk{width:100%;margin-top:18px}
.ghost{background:transparent;color:var(--tx);border-color:var(--ln)}
.danger{background:transparent;color:var(--bad);border-color:var(--ln)}
.sm{padding:6px 14px;font-size:13px;letter-spacing:.1em}
label{display:block;font-size:12px;color:var(--sub);margin:18px 0 2px;letter-spacing:.18em}
input,select,textarea{width:100%;font:inherit;padding:10px 2px;border:0;border-bottom:2px solid var(--ln);border-radius:0;background:transparent;color:var(--tx)}
select{padding-right:0}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ac)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.mask{position:fixed;inset:0;background:rgba(var(--ink),.38);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mask[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:6px 6px 0 0;padding:26px 22px 30px;max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:600px){.mask{align-items:center}.sheet{border-radius:6px}}
.big{text-align:center;padding:14px 0 4px}.big h2{margin:18px 0 6px}
.stamp{display:inline-block;border:3px solid var(--ac);color:var(--ac);font-family:var(--serif);font-size:22px;font-weight:700;padding:8px 16px;letter-spacing:.3em;border-radius:4px;transform:rotate(-5deg)}
.stamp.w{border-color:var(--warn);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:2px;font-size:13px;letter-spacing:.1em;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1}
.sk{height:170px;border-radius:4px;margin:16px 0;background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
th{font-weight:700;color:var(--sub);font-size:11px;letter-spacing:.16em}
th,td{text-align:left;padding:8px 6px;border-bottom:2px solid var(--ln);white-space:nowrap}
tr.x td{opacity:.5}
.foot{text-align:center;margin-top:40px}.foot a{color:var(--sub);font-size:12px;letter-spacing:.16em;cursor:pointer;border-bottom:2px solid var(--ln);padding-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:6px 0;letter-spacing:.06em}.chk input{width:auto;accent-color:var(--ac)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.course{background:var(--card);border:2px solid var(--ln);border-top:5px solid var(--ac);border-radius:4px;padding:24px 22px 22px;margin:20px 0}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-no{font-family:"Times New Roman",Times,serif;font-size:12px;letter-spacing:.32em;color:var(--ac)}
.c-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:12px 0 4px}
.c-head h2{font-size:22px;line-height:1.35}
.c-seat{text-align:right;flex:none}
.c-seat b{display:block;font-family:"Times New Roman",Times,serif;font-size:40px;line-height:1;color:var(--ac)}
.c-seat span{font-size:11px;letter-spacing:.22em;color:var(--sub)}
.c-info{margin:18px 0 0;border-top:2px solid var(--ln)}
.c-info div{display:grid;grid-template-columns:4.4em 1fr;padding:11px 0;border-bottom:2px solid var(--ln);font-size:14px}
.c-info dt{color:var(--sub);font-size:12px;letter-spacing:.26em;padding-top:2px}
.c-info dd{margin:0}
.c-prog{margin-top:22px}
.c-prog-t{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);letter-spacing:.14em;margin-bottom:9px}
.c-prog-t b{font-family:"Times New Roman",Times,serif;font-size:20px;color:var(--tx);letter-spacing:0}
.chip.solid{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.outline{background:transparent;color:var(--ac);border-color:var(--ac)}
.card .bar{margin:16px 0 8px}
body,body *{font-weight:700}
input::placeholder{font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="toast"></div>
<div class="mask" id="mask" hidden><div class="sheet" id="sheet"></div></div>
<script>
const STETH = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9v15a8 8 0 0 0 16 0V9"/><circle cx="14" cy="7" r="2"/><circle cx="30" cy="7" r="2"/><path d="M22 32v8a12 12 0 0 0 24 0v-6"/><circle cx="46" cy="28" r="6"/><circle cx="46" cy="28" r="1.8" fill="currentColor"/></svg>';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const API_URL = "https://script.google.com/macros/s/AKfycbx6Y0ZzTe9gwz-06J-zg-qINysUClwRtzvBH8gOeR-BHfaCTv074Cr2gzzvlL3a4zE/exec";
const run = async (fn, ...a) => {
  let res;
  try {
    res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: a }) });
  } catch (e) { throw new Error("無法連線到伺服器，請檢查網路"); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error("伺服器回應異常，請稍後再試"); }
  if (j.error) throw new Error(j.error);
  return j.result;
};
const em = e => (e && e.message) ? String(e.message).replace(/^Error:\s*/, "") : "發生錯誤，請稍後再試";
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
};
const S = { view: "home", courses: null, pw: "", admin: null, mineEmp: store.get("emp"), mineList: null, mineMsg: "", regs: {} };

/* ---------- 共用元件 ---------- */
let tt;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2400); }
function sheet(h){ $("#sheet").innerHTML = h; $("#mask").hidden = false; }
function closeSheet(){ $("#mask").hidden = true; $("#sheet").innerHTML = ""; }
let confirmRes = null;
function ask(msg, okLabel){
  return new Promise(res => {
    confirmRes = res;
    sheet(`<h3>${esc(msg)}</h3><div class="acts"><button class="ghost" style="flex:1" data-act="cNo">取消</button><button style="flex:1" data-act="cOk">${esc(okLabel || "確定")}</button></div>`);
  });
}
function copyText(t){
  const done = () => toast("已複製，可直接貼到試算表");
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done, fallback); } else fallback();
  function fallback(){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("複製失敗"); } a.remove(); }
}

/* ---------- 學員端 ---------- */
async function load(){
  try { S.courses = await run("getData"); } catch (e) { S.courses = []; toast("載入失敗，請重新整理"); }
  if (S.view !== "admin") render();
}

function heroHtml(){
  const cs = S.courses || [], open = cs.filter(c => c.open);
  const seats = open.reduce((a, c) => a + Math.max(c.cap - c.count, 0), 0);
  return `<div class="hero"><div class="mark">${STETH}</div><div class="en">Clinical Skills Training</div><h1>臨床技能課程報名</h1><p>自由報名・額滿後自動列入候補・可隨時取消</p>
    <div class="pills"><span class="pill"><b>${open.length}</b>開放課程</span><span class="pill"><b>${seats}</b>剩餘名額</span></div></div>
    <div class="tabs"><button class="${S.view === "home" ? "on" : ""}" data-act="tab" data-v="home">課程報名</button><button class="${S.view === "mine" ? "on" : ""}" data-act="tab" data-v="mine">我的報名</button></div>`;
}

function cardHtml(c, idx){
  const left = Math.max(c.cap - c.count, 0), wait = Math.max(c.count - c.cap, 0);
  const pct = c.cap ? Math.min(100, Math.round(Math.min(c.count, c.cap) / c.cap * 100)) : 0;
  const st = !c.open ? '<span class="chip">已截止</span>' : left > 0 ? '<span class="chip ok">報名中</span>' : '<span class="chip solid">已額滿・可候補</span>';
  const lv = c.levels.length ? c.levels.map(l => `<span class="lv">${esc(l)}</span>`).join("") : '<span class="lv">不限級別</span>';
  const btn = c.open ? `<button class="blk ${left > 0 ? "" : "outline"}" data-act="reg" data-id="${esc(c.id)}">${left > 0 ? "我要報名" : "登記候補"}</button>` : '<button class="blk ghost" disabled>已截止報名</button>';
  const row = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  return `<article class="course">
    <div class="c-top"><span class="c-no">COURSE ${String((idx || 0) + 1).padStart(2, "0")}</span>${st}</div>
    <div class="c-head"><h2>${esc(c.title)}</h2><div class="c-seat"><b>${left}</b><span>剩餘名額</span></div></div>
    <dl class="c-info">${row("日期", esc(c.when))}${row("地點", esc(c.place))}${c.deadline ? row("截止", esc(c.deadline)) : ""}${c.note ? row("備註", esc(c.note)) : ""}${row("對象", lv)}</dl>
    <div class="c-prog"><div class="c-prog-t"><span>報名進度</span><span><b>${Math.min(c.count, c.cap)}</b> / ${c.cap}${wait ? "・候補 " + wait : ""}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>
    ${btn}</article>`;
}

function homeHtml(){
  if (S.courses === null) return '<div class="sk"></div><div class="sk"></div>';
  if (!S.courses.length) return '<div class="card meta">目前沒有課程，請稍後再來看看。</div>';
  return S.courses.map(cardHtml).join("");
}

function mineHtml(){
  let out = `<div class="card"><h3>用人事號查詢</h3><label>人事號</label><input id="qe" value="${esc(S.mineEmp)}" autocomplete="off" inputmode="text">
    <button class="blk" data-act="lookup">查詢</button><div class="err" style="color:var(--sub)">${esc(S.mineMsg)}</div></div>`;
  if (S.mineList) out += S.mineList.map(x => `<div class="card"><div class="row"><div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.when)}・${esc(x.name)}</div><div class="meta">報名時間：${esc(x.regTime || "")}</div></div>
    <span class="chip ${x.status === "正取" ? "ok" : "warn"}">${esc(x.status)}</span></div>
    <button class="blk danger" data-act="cancelMine" data-id="${esc(x.courseId)}">取消這門課的報名</button></div>`).join("");
  return out;
}

function render(){
  const r = $("#root");
  if (S.view === "admin") { r.innerHTML = S.pw ? adminHtml() : loginHtml(); return; }
  r.innerHTML = heroHtml() + (S.view === "home" ? homeHtml() : mineHtml()) + '<div class="foot"><a data-act="goAdmin">管理者登入</a></div>';
}

function regForm(c, err){
  const left = Math.max(c.cap - c.count, 0);
  const opts = ["PGY2", "PGY1"].map(l => `<option ${l === (store.get("lv") || "PGY2") ? "selected" : ""}>${l}</option>`).join("");
  sheet(`<form data-form="reg" data-id="${esc(c.id)}"><h3>${esc(c.title)}</h3>
    <div class="meta">${esc(c.when)}・${esc(c.place)}</div>
    ${left === 0 ? '<div class="meta warn">目前已額滿，送出後會列入候補。</div>' : ""}
    <label>姓名</label><input name="name" required value="${esc(store.get("name"))}" autocomplete="name">
    <label>人事號</label><input name="empId" required value="${esc(store.get("emp"))}" autocomplete="off">
    <label>級別</label><select name="level">${opts}</select>
    <div class="err">${esc(err || "")}</div>
    <div class="acts"><button type="button" class="ghost" style="flex:1" data-act="closeSheet">取消</button><button type="submit" style="flex:2">送出報名</button></div></form>`);
}

/* ---------- 管理端 ---------- */
function loginHtml(){
  return `<div class="hero"><div class="mark">${STETH}</div><div class="en">Administrator</div><h1>管理後台</h1><p>請輸入管理密碼</p></div>
    <form class="card" data-form="login"><label>管理密碼</label><input type="password" name="pw" required autocomplete="current-password">
    <div class="err"></div><button class="blk" type="submit">登入</button>
    <button class="blk ghost" type="button" data-act="goHome">← 回報名頁</button></form>`;
}

function adminHtml(){
  const L = S.admin;
  let h = `<div class="row" style="margin-bottom:6px"><h2>管理後台</h2><div class="acts" style="margin:0">
    <button class="sm" data-act="newCourse">＋ 新增課程</button><button class="sm ghost" data-act="goHome">報名頁</button><button class="sm ghost" data-act="adminOut">登出</button></div></div>`;
  if (!L) return h + '<div class="sk"></div><div class="sk"></div>';
  if (!L.length) return h + '<div class="card meta">還沒有課程，按右上角「新增課程」開始。</div>';
  const total = L.reduce((a, c) => a + c.regs.filter(r => r.status !== "已取消").length, 0);
  h += `<div class="meta">共 ${L.length} 門課程・${total} 筆有效報名</div>`;
  h += L.map(c => {
    const act = c.regs.filter(r => r.status !== "已取消");
    const wait = Math.max(act.length - c.cap, 0);
    const chip = c.open ? '<span class="chip ok">報名中</span>' : '<span class="chip bad">已截止</span>';
    const rows = c.regs.map((r, i) => `<tr class="${r.status === "已取消" ? "x" : ""}"><td>${esc(r.time)}</td><td>${esc(r.name)}</td><td>${esc(r.empId)}</td><td>${esc(r.level)}</td><td>${esc(r.status)}</td><td>${esc(r.cancelTime || "")}</td>
      <td>${r.status === "已取消" ? "" : `<a class="bad" style="cursor:pointer" data-act="cancelReg" data-id="${esc(c.id)}" data-emp="${esc(r.empId)}">取消</a>`}</td></tr>`).join("");
    return `<div class="card"><div class="row"><h2>${esc(c.title)}</h2>${chip}</div>
      <div class="meta" style="margin-top:6px">${esc(c.when)}・${esc(c.place)}</div>
      <div class="meta">對象：${c.levels.length ? esc(c.levels.join("、")) : "不限級別"}${c.deadline ? "・截止 " + esc(c.deadline) : ""}</div>
      <div class="meta"><b>正取 ${Math.min(act.length, c.cap)}／${c.cap}</b>${wait ? "・候補 " + wait : ""}</div>
      <div class="acts"><button class="sm" data-act="editCourse" data-id="${esc(c.id)}">編輯</button><button class="sm ghost" data-act="dupCourse" data-id="${esc(c.id)}">複製</button>
      <button class="sm ghost" data-act="toggleCourse" data-id="${esc(c.id)}" data-open="${c.statusOpen ? "0" : "1"}">${c.statusOpen ? "手動截止" : "重新開放"}</button>
      <button class="sm ghost" data-act="copyList" data-id="${esc(c.id)}">複製名單</button>
      <button class="sm danger" data-act="delCourse" data-id="${esc(c.id)}">刪除</button></div>
      <div class="scroll"><table><tr><th>報名時間</th><th>姓名</th><th>人事號</th><th>級別</th><th>狀態</th><th>取消時間</th><th></th></tr>${rows || '<tr><td colspan="7" class="meta">尚無人報名</td></tr>'}</table></div></div>`;
  }).join("");
  return h;
}

async function loadAdmin(){
  try { S.admin = await run("adminList", S.pw); }
  catch (e) { toast(em(e)); if (/密碼/.test(em(e))) S.pw = ""; S.admin = null; }
  render();
}

function editor(c, err, dup){
  c = c || { id: "", title: "", when: "", place: "", cap: 6, levels: ["PGY2"], note: "", deadline: "", statusOpen: true };
  const lv = ["PGY2", "PGY1"].map(l => `<label class="chk"><input type="checkbox" name="lv" value="${l}" ${c.levels.indexOf(l) >= 0 ? "checked" : ""}>${l}</label>`).join("");
  sheet(`<form data-form="course"><h3>${c.id ? "編輯課程" : dup ? "複製課程" : "新增課程"}</h3>${dup ? '<div class="meta">已帶入原課程內容，請修改日期、地點等資訊後儲存，會建立成一門新課程。</div>' : ""}<input type="hidden" name="id" value="${esc(c.id)}">
    <label>課程名稱</label><input name="title" required value="${esc(c.title)}">
    <label>日期時間（例：10/14（三）13:00–14:00）</label><input name="when" required value="${esc(c.when)}">
    <label>地點</label><input name="place" required value="${esc(c.place)}">
    <div class="grid2"><div><label>名額</label><input name="cap" type="number" min="1" required value="${esc(c.cap)}"></div>
    <div><label>狀態</label><select name="open"><option value="1" ${c.statusOpen ? "selected" : ""}>開放報名</option><option value="0" ${c.statusOpen ? "" : "selected"}>手動截止</option></select></div></div>
    <label>限定級別（都不勾＝不限）</label><div class="row" style="justify-content:flex-start;gap:18px">${lv}</div>
    <label>報名截止時間（選填，到時自動截止）</label><input name="deadline" type="datetime-local" value="${esc((c.deadline || "").replace(" ", "T"))}">
    <label>備註（選填）</label><input name="note" value="${esc(c.note)}">
    ${c.id ? '<div class="meta" style="margin-top:10px">提醒：修改名額後，正取／候補會依報名時間自動重新計算。</div>' : ""}
    <div class="err">${esc(err || "")}</div>
    <div class="acts"><button type="button" class="ghost" style="flex:1" data-act="closeSheet">取消</button><button type="submit" style="flex:2">儲存</button></div></form>`);
}

/* ---------- 事件 ---------- */
document.addEventListener("input", e => { if (e.target.id === "qe") S.mineEmp = e.target.value; });
$("#mask").addEventListener("click", e => { if (e.target.id === "mask" && !confirmRes) closeSheet(); });

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "cOk" || a === "cNo") { const r = confirmRes; confirmRes = null; closeSheet(); if (r) r(a === "cOk"); return; }
  if (a === "closeSheet") return closeSheet();
  if (a === "tab") { S.view = t.dataset.v; render(); window.scrollTo(0, 0); return; }
  if (a === "goAdmin") { S.view = "admin"; render(); return; }
  if (a === "goHome") { S.view = "home"; render(); load(); return; }
  if (a === "reg") { const c = S.courses.find(x => x.id === id); if (c) regForm(c); return; }

  if (a === "lookup") {
    const v = ($("#qe").value || "").trim(); S.mineEmp = v;
    if (!v) { S.mineMsg = "請輸入人事號"; S.mineList = null; render(); return; }
    S.mineMsg = "查詢中…"; render();
    try { S.mineList = await run("lookup", v); S.mineMsg = S.mineList.length ? "找到 " + S.mineList.length + " 筆報名" : "查無報名資料（請確認人事號）"; }
    catch (x) { S.mineMsg = em(x); S.mineList = null; }
    render(); return;
  }
  if (a === "cancelMine") {
    if (!(await ask("確定要取消這門課的報名？", "確定取消"))) return;
    try {
      const r = await run("cancel", id, S.mineEmp);
      toast(r.ok ? "已取消報名" : r.msg);
      S.mineList = await run("lookup", S.mineEmp); S.mineMsg = S.mineList.length ? "找到 " + S.mineList.length + " 筆報名" : "目前沒有有效的報名";
    } catch (x) { toast(em(x)); }
    render(); load(); return;
  }

  /* 管理 */
  if (a === "adminOut") { S.pw = ""; S.admin = null; S.view = "home"; render(); load(); return; }
  if (a === "newCourse") return editor();
  if (a === "editCourse") return editor(S.admin.find(x => x.id === id));
  if (a === "dupCourse") { const o = S.admin.find(x => x.id === id); return editor(Object.assign({}, o, { id: "", title: o.title + "（複製）", deadline: "", statusOpen: true, levels: o.levels.slice() }), "", true); }
  if (a === "toggleCourse") {
    try { await run("adminToggle", S.pw, id, t.dataset.open === "1"); toast("已更新"); } catch (x) { toast(em(x)); }
    return loadAdmin();
  }
  if (a === "delCourse") {
    if (!(await ask("確定刪除這門課程？（報名紀錄仍保留在試算表）", "刪除"))) return;
    try { await run("adminDeleteCourse", S.pw, id); toast("已刪除"); } catch (x) { toast(em(x)); }
    return loadAdmin();
  }
  if (a === "cancelReg") {
    if (!(await ask("確定取消 " + t.dataset.emp + " 的報名？", "確定取消"))) return;
    try { const r = await run("adminCancelReg", S.pw, id, t.dataset.emp); toast(r.ok ? "已取消" : r.msg); } catch (x) { toast(em(x)); }
    return loadAdmin();
  }
  if (a === "copyList") {
    const c = S.admin.find(x => x.id === id);
    const lines = c.regs.filter(r => r.status !== "已取消").map((r, i) => [i + 1, r.status, r.name, r.empId, r.level, r.time].join("\t"));
    return copyText(["序號\t狀態\t姓名\t人事號\t級別\t報名時間"].concat(lines).join("\n"));
  }
});

document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form, fd = new FormData(f), btn = f.querySelector("[type=submit]"), err = f.querySelector(".err");
  const lock = on => { if (btn) { btn.disabled = on; if (on) btn.dataset.t = btn.textContent, btn.textContent = "處理中…"; else btn.textContent = btn.dataset.t || btn.textContent; } };

  if (kind === "reg") {
    const c = S.courses.find(x => x.id === f.dataset.id);
    const d = { courseId: c.id, name: String(fd.get("name")).trim(), empId: String(fd.get("empId")).trim(), level: fd.get("level") };
    lock(true);
    try {
      const r = await run("register", d);
      if (!r.ok) { lock(false); err.textContent = r.msg; return; }
      store.set("name", d.name); store.set("emp", d.empId); store.set("lv", d.level); S.mineEmp = d.empId;
      const ok = r.status === "正取";
      sheet(`<div class="big"><div class="stamp ${ok ? "" : "w"}">${ok ? "正取" : "候補"}</div><h2>${ok ? "報名成功" : "已列入候補"}</h2>
        <div class="meta">${esc(c.title)}・${esc(d.name)}</div>
        <div class="${ok ? "ok" : "warn"}" style="margin-top:10px;font-weight:700">${ok ? "你是正取" : "候補第 " + (r.pos - r.cap) + " 位"}</div>
        <div class="meta" style="margin-top:10px">之後可到「我的報名」用人事號查詢或取消。</div>
        <button class="blk" data-act="closeSheet">完成</button></div>`);
      load();
    } catch (x) { lock(false); err.textContent = em(x); }
    return;
  }
  if (kind === "login") {
    const pw = String(fd.get("pw")); lock(true);
    try {
      const r = await run("adminLogin", pw);
      if (!r.ok) { lock(false); err.textContent = r.msg; return; }
      S.pw = pw; S.admin = null; render(); loadAdmin();
    } catch (x) { lock(false); err.textContent = em(x); }
    return;
  }
  if (kind === "course") {
    const c = {
      id: fd.get("id"), title: fd.get("title"), when: fd.get("when"), place: fd.get("place"), cap: fd.get("cap"),
      open: fd.get("open") === "1", levels: fd.getAll("lv"), note: fd.get("note"),
      deadline: String(fd.get("deadline") || "").replace("T", " ")
    };
    lock(true);
    try { await run("adminSaveCourse", S.pw, c); closeSheet(); toast("已儲存"); loadAdmin(); load(); }
    catch (x) { lock(false); err.textContent = em(x); }
  }
});

render();
load();
</script>
</body>
</html>
