<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#667085;--ln:#e3e6ec;--ac:#0e7c86;--acx:#fff;--bad:#c0392b;--ok:#1e8e5a;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--tx:#e8ebf0;--sub:#9aa3b2;--ln:#2b3340;--ac:#3cb8c4;--acx:#08242a;--bad:#ef7b6e;--ok:#4cc88a;--warn:#e0b34f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:17px;margin:0}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.meta{font-size:14px;color:var(--sub);margin:2px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);cursor:pointer;width:100%;margin-top:10px}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--ln);width:auto;margin:0}
button:disabled{opacity:.5}
label{display:block;font-size:14px;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.msg{font-size:14px;margin-top:8px;min-height:20px}
</style>
</head>
<body>
<main>
  <h1>課程報名</h1>
  <div class="sub">自由報名・額滿後自動列入候補</div>
  <div id="app"><div class="card sub">載入中…</div></div>
  <div class="card">
    <h2>查詢／取消我的報名</h2>
    <label>姓名</label><input id="qn">
    <label>人事號</label><input id="qe">
    <button class="ghost" id="qb">查詢</button>
    <div id="qr" class="msg"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const run = (fn, ...a) => new Promise((ok, no) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
let courses = [], openId = null, done = {}, errs = {};

async function load() {
  try { courses = await run("getData"); render(); }
  catch (e) { $("#app").innerHTML = '<div class="card bad">載入失敗，請重新整理頁面。</div>'; }
}

function render() {
  if (!courses.length) { $("#app").innerHTML = '<div class="card sub">目前沒有開放報名的課程。</div>'; return; }
  $("#app").innerHTML = courses.map(card).join("");
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { openId = openId === b.dataset.open ? null : b.dataset.open; render(); });
  document.querySelectorAll("form[data-form]").forEach(f => f.onsubmit = e => { e.preventDefault(); submit(f); });
}

function card(c) {
  const left = Math.max(c.cap - c.count, 0);
  const tag = !c.open ? '<span class="tag bad">已截止</span>'
    : left > 0 ? `<span class="tag ok">剩 ${left} 位</span>`
    : '<span class="tag warn">額滿・可登記候補</span>';
  let body = "";
  if (done[c.id]) {
    body = `<div class="msg ${done[c.id].status === "正取" ? "ok" : "warn"}"><b>${done[c.id].status === "正取" ? "✅ 報名成功（正取）" : "⏳ 已列入候補第 " + (done[c.id].pos - c.cap) + " 位"}</b></div>`;
  } else if (c.open && openId === c.id) {
    body = `<form data-form="${esc(c.id)}">
      <label>姓名</label><input name="name" required>
      <label>人事號</label><input name="empId" required>
      <label>級別</label><select name="level"><option>PGY2</option><option>PGY1</option></select>
      <button type="submit">送出報名</button>
      <div class="msg bad">${esc(errs[c.id] || "")}</div></form>`;
  } else if (c.open) {
    body = `<button data-open="${esc(c.id)}">我要報名</button>`;
  }
  const lim = c.levels.length ? "限 " + c.levels.join("、") : "不限級別";
  return `<div class="card"><div class="row"><h2>${esc(c.title)}</h2>${tag}</div>
    <div class="meta">📅 ${esc(c.when)}</div><div class="meta">📍 ${esc(c.place)}</div>
    <div class="meta">👥 名額 ${c.cap} 位（已報名 ${c.count}）・🙋 ${esc(lim)}</div>
    ${c.note ? `<div class="meta">📝 ${esc(c.note)}</div>` : ""}${body}</div>`;
}

async function submit(f) {
  const fd = new FormData(f), id = f.dataset.form;
  const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "送出中…";
  try {
    const r = await run("register", { courseId: id, name: fd.get("name"), empId: fd.get("empId"), level: fd.get("level") });
    if (r.ok) { done[id] = r; errs[id] = ""; } else { errs[id] = r.msg; }
  } catch (e) { errs[id] = "送出失敗，請稍後再試"; }
  await load();
}

$("#qb").onclick = async () => {
  const n = $("#qn").value, e = $("#qe").value, out = $("#qr");
  out.className = "msg"; out.textContent = "查詢中…";
  try {
    const list = await run("lookup", n, e);
    if (!list.length) { out.className = "msg bad"; out.textContent = "查無報名資料（請確認姓名與人事號）"; return; }
    out.innerHTML = list.map(x => `<div class="row" style="margin:8px 0"><span>${esc(x.title)}：<b class="${x.status === "正取" ? "ok" : "warn"}">${esc(x.status)}</b></span>
      <button class="danger" data-c="${esc(x.courseId)}">取消報名</button></div>`).join("");
    out.querySelectorAll("[data-c]").forEach(b => b.onclick = async () => {
      if (!confirm("確定取消報名？")) return;
      b.disabled = true;
      try {
        const r = await run("cancel", b.dataset.c, n, e);
        delete done[b.dataset.c];
        out.className = "msg " + (r.ok ? "ok" : "bad"); out.textContent = r.ok ? "已取消報名" : r.msg;
      } catch (x) { out.className = "msg bad"; out.textContent = "取消失敗，請稍後再試"; }
      load();
    });
  } catch (x) { out.className = "msg bad"; out.textContent = "查詢失敗，請稍後再試"; }
};

load();
</script>
</body>
</html>
