<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>PGY 臨床技能排課｜奇美醫院教學部</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20stroke%3D%22%235e8a6a%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%3E%3Crect%20x%3D%228%22%20y%3D%2212%22%20width%3D%2248%22%20height%3D%2244%22%20rx%3D%224%22/%3E%3Cpath%20d%3D%22M8%2024h48M20%206v10M44%206v10M22%2040l7%207%2014-14%22/%3E%3C/svg%3E">
<style>
:root{--ink:45,45,42;--g:94,138,106;--bg:#f6f4ee;--card:#fbfaf6;--white:#ffffff;--tx:rgb(var(--ink));--sub:rgba(var(--ink),.6);--ln:rgba(var(--ink),.18);--ac:rgb(var(--g));--ac2:rgba(var(--g),.55);--acx:#f6f4ee;--chip:rgba(var(--g),.14);--bad:#b4533f;--badbg:rgba(180,83,63,.12);--warn:#a8792a;--warnbg:rgba(168,121,42,.14);--info:#4f6fa0;--infobg:rgba(79,111,160,.13);--serif:"Times New Roman",Times,"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:236,233,225;--g:147,184,156;--bg:#1b1d1a;--card:#22251f;--white:#262923;--acx:#1b1d1a;--bad:#e08c78;--badbg:rgba(224,140,120,.15);--warn:#dcb167;--warnbg:rgba(220,177,103,.15);--info:#93acd6;--infobg:rgba(147,172,214,.15)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 14px/1.65 "Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",system-ui,sans-serif;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:8px 20px 64px}
header.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 16px;flex-wrap:wrap}
.hero .en{font-size:11px;letter-spacing:.32em;color:var(--ac);text-transform:uppercase}
.hero h1{font-family:var(--serif);font-size:26px;margin:4px 0 0;letter-spacing:.12em}
.hero p{margin:2px 0 0;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
.tabs button{flex:none;background:none;color:var(--sub);border:0;border-radius:0;padding:12px 14px 10px;letter-spacing:.12em;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:6px;padding:18px 18px;margin:16px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.left{justify-content:flex-start}
h2{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:.06em}
h3{font-family:var(--serif);font-size:16px;margin:0 0 8px;letter-spacing:.06em}
.meta{font-size:12.5px;color:var(--sub)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:3px;border:1.5px solid var(--ln);white-space:nowrap;color:var(--sub);line-height:1.6}
.chip.ok{color:var(--ac);border-color:var(--ac2);background:var(--chip)}
.chip.bad{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.chip.info{color:var(--info);border-color:var(--info);background:var(--infobg)}
.chip.dark{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button{font:inherit;border:1.5px solid var(--ac);border-radius:4px;padding:9px 16px;background:var(--ac);color:var(--acx);cursor:pointer;letter-spacing:.1em;transition:opacity .15s}
button:hover{opacity:.86}button:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--tx);border-color:var(--ln)}
.danger{background:transparent;color:var(--bad);border-color:var(--ln)}
.sm{padding:4px 11px;font-size:12.5px;letter-spacing:.05em}
.xs{padding:1px 8px;font-size:12px;letter-spacing:0}
label.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 2px;letter-spacing:.12em}
input,select,textarea{font:inherit;padding:7px 8px;border:1.5px solid var(--ln);border-radius:4px;background:var(--white);color:var(--tx);width:100%}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac)}
[hidden]{display:none!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.inline{width:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1.5px solid var(--ln);border-radius:6px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--ac)}
.stat span{font-size:12px;color:var(--sub);letter-spacing:.14em}
.stat.alert b{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar i.s{background:var(--info);opacity:.7}
.bar2{display:flex;height:8px;border-radius:99px;background:var(--chip);overflow:hidden;min-width:80px}
.bar2 i{display:block;height:100%}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--sub);font-size:11.5px;letter-spacing:.1em;background:var(--card)}
th,td{text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--ln);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
.mx th,.mx td{text-align:center;padding:6px 6px}
.mx td:first-child,.mx th:first-child,.mx td:nth-child(2),.mx th:nth-child(2){text-align:left}
.mx th.v{white-space:normal;min-width:72px;max-width:96px;padding:8px 4px;letter-spacing:0;font-size:12px;line-height:1.3;word-break:break-all}
.mx .sticky{position:sticky;left:0;background:var(--card);z-index:1}
.cell{display:inline-block;min-width:44px;border-radius:3px;font-size:11.5px;padding:1px 4px}
.cell.done{background:var(--chip);color:var(--ac)}
.cell.sch{background:var(--infobg);color:var(--info)}
.cell.miss{color:var(--sub)}
.cell.late{background:var(--badbg);color:var(--bad)}
.cell.na{color:var(--ln)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1.5px solid var(--ln);border-top:1.5px solid var(--ln)}
.cal>div{border-right:1.5px solid var(--ln);border-bottom:1.5px solid var(--ln);min-height:92px;padding:4px 5px;background:var(--card);cursor:pointer;overflow:hidden}
.cal>div.hd{min-height:0;text-align:center;font-size:12px;color:var(--sub);cursor:default;background:transparent;padding:4px}
.cal>div.out{background:transparent;cursor:default}
.cal>div.we .dn{color:var(--bad)}
.cal>div.today{box-shadow:inset 0 0 0 2px var(--ac2)}
.dn{font-size:12px;color:var(--sub)}
.ev{display:block;font-size:11.5px;line-height:1.35;border-radius:3px;padding:2px 4px;margin-top:3px;border-left:3px solid var(--ln);background:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-draft{border-left-color:var(--sub)!important}
.st-pending{border-left-color:var(--warn)!important;background:var(--warnbg)!important}
.st-confirmed{border-left-color:var(--ac)!important;background:var(--chip)!important}
.st-resched{border-left-color:var(--bad)!important;background:var(--badbg)!important}
.st-done{border-left-color:var(--tx)!important;opacity:.7}
.st-cancel{text-decoration:line-through;opacity:.45}
@media (max-width:720px){.cal>div{min-height:64px;padding:2px}.ev{font-size:10px;padding:1px 2px}}
.mask{position:fixed;inset:0;background:rgba(var(--ink),.38);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.mask[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:760px;border-radius:8px;padding:22px 22px 24px;animation:up .2s ease}
.sheet.narrow{max-width:480px}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts.end{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:4px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
#toast.show{opacity:1}
.list{max-height:360px;overflow:auto;border:1.5px solid var(--ln);border-radius:4px;background:var(--white)}
.list label{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:13px}
.list label:last-child{border-bottom:0}
.list label .grow{flex:1;min-width:0}
.ok{color:var(--ac)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.empty{padding:26px;text-align:center;color:var(--sub)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.dot.lg{border-left:10px solid var(--ln);width:12px;background:var(--white)}
.ccard{background:var(--card);border:1.5px solid var(--ln);border-top:4px solid var(--ac);border-radius:6px;padding:16px 16px 14px}
.ccard.off{border-top-color:var(--ln);opacity:.7}
.ccard dl{display:grid;grid-template-columns:4.5em 1fr;gap:3px 10px;margin:10px 0 0;font-size:13px}
.ccard dt{color:var(--sub);font-size:12px;letter-spacing:.12em}
.ccard dd{margin:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:10px}
.sec{margin-top:26px}
.pill{display:inline-block;font-size:11px;border:1.5px solid var(--ac2);color:var(--ac);border-radius:3px;padding:0 6px;letter-spacing:.06em}
.pill.p2{border-color:var(--info);color:var(--info)}
.pill.u{border-color:var(--ln);color:var(--sub)}
a.lnk{color:var(--ac);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.note{background:var(--warnbg);border-left:3px solid var(--warn);padding:8px 12px;border-radius:3px;font-size:13px;margin-top:10px}
.foot{text-align:center;color:var(--sub);font-size:12px;letter-spacing:.16em;margin-top:40px}
code.k{word-break:break-all;font-size:11px;background:var(--white);border:1px solid var(--ln);padding:6px;display:block;border-radius:4px;max-height:90px;overflow:auto}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="toast"></div>
<div class="mask" id="mask" hidden><div class="sheet" id="sheet"></div></div>
<script src="pgy-config.js"></script>
<script>
"use strict";
/* ================= 基本工具 ================= */
const KEY = "pgy-skills-v1";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const p2 = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const TODAY = ymd(new Date());
const WD = ["日","一","二","三","四","五","六"];
const md = s => s ? (+s.slice(5, 7)) + "/" + (+s.slice(8, 10)) : "";
const mdw = s => s ? md(s) + "（" + WD[new Date(s + "T00:00").getDay()] + "）" : "";
const monthEnd = m => { const [y, mo] = m.split("-").map(Number); return m + "-" + p2(new Date(y, mo, 0).getDate()); };
const addDays = (s, n) => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const LEVELS = ["PGY1", "PGY2", "UGY"];
const STATUS = {
  draft:     { t: "草擬",       c: "" },
  pending:   { t: "待導師確認", c: "warn" },
  confirmed: { t: "導師已確認", c: "ok" },
  resched:   { t: "導師建議改期", c: "bad" },
  done:      { t: "已完成",     c: "dark" },
  cancel:    { t: "已取消",     c: "" }
};
const stChip = s => `<span class="chip ${STATUS[s] ? STATUS[s].c : ""}">${STATUS[s] ? STATUS[s].t : esc(s)}</span>`;
const lvPill = l => `<span class="pill ${l === "PGY2" ? "p2" : l === "UGY" ? "u" : ""}">${esc(l)}</span>`;

/* 日期正規化：支援 2026/7/1、2026.7.1、115/7/1（民國）、20260701 */
function normDate(v){
  const t = String(v || "").trim(); if (!t) return "";
  let m = t.match(/^(\d{8})$/);
  if (m) return m[1].slice(0, 4) + "-" + m[1].slice(4, 6) + "-" + m[1].slice(6, 8);
  m = t.match(/(\d{2,4})\s*[\/.\-年]\s*(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/);
  if (!m) return "";
  let y = +m[1]; if (y < 1000) y += 1911;
  return y + "-" + p2(m[2]) + "-" + p2(m[3]);
}
const normName = s => String(s || "").toLowerCase().replace(/[\s_\-－＿・.]/g, "");

/* UTF-8 安全的 base64url */
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));

/* ================= 資料 ================= */
const RULE_SRC = "依 10/15 季恆 課程安排規則";
function seedCourses(){
  const c = (name, o) => Object.assign({ id: uid(), name, level: "PGY1", content: "", place: "", cap: 0, capFlex: false, audience: "", ugy: false, instructor: "", start: "", end: "", note: "", active: true }, o);
  return [
    c("急救",           { content: "上課",      place: "九樓空橋",   cap: 0,  audience: "全體 PGY1 + UGY（UGY 人選可自訂）", ugy: true, note: RULE_SRC }),
    c("ALS_TRM",        { content: "上課+實作", place: "教學中心四樓", cap: 6,  audience: "最多 6 名 PGY1", note: RULE_SRC }),
    c("休克處置",       { content: "未定",      place: "未定",       cap: 0,  audience: "未定", note: "課程內容／地點／人員皆未定・" + RULE_SRC }),
    c("急性呼吸道處置", { content: "上課+實作", place: "教學中心四樓", cap: 10, capFlex: true, audience: "最多 10 名 PGY1（可視情況增加）", note: RULE_SRC }),
    c("呼吸道處置_擬真", { content: "上課+實作", place: "教學中心四樓", cap: 4,  audience: "4 名 PGY1", note: RULE_SRC }),
    c("CVC放置_echo",   { content: "上課+實作", place: "教學中心四樓", cap: 7,  audience: "7 名 PGY1", note: RULE_SRC })
  ];
}
function emptyDB(){ return { v: 1, courses: seedCourses(), students: [], records: [], sessions: [], updated: "" }; }
function loadDB(){
  try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j && j.courses) return j; } catch (e) {}
  return emptyDB();
}
let DB = loadDB();
function save(fromCloud){
  if (!fromCloud) DB.updated = new Date().toLocaleString("zh-TW", { hour12: false });
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast("無法儲存到瀏覽器，請匯出備份"); }
  if (!fromCloud && API_URL) { CL.edits++; setDirty(true); schedulePush(); }
}

/* ================= 雲端同步（Google Apps Script） ================= */
const CFG = window.PGY_CONFIG || {};
const API_URL = String(CFG.api || "").trim();
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const lsSet = (k, v) => { try { if (v === "" || v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const CL = { pw: "", ver: +lsGet("pgy-cloud-ver") || 0, dirty: lsGet("pgy-dirty") === "1", st: API_URL ? "out" : "off", msg: "", edits: 0, timer: null, busy: false, last: "" };
function setDirty(v){ CL.dirty = v; lsSet("pgy-dirty", v ? "1" : ""); }
function setVer(v){ CL.ver = v; lsSet("pgy-cloud-ver", String(v)); }
async function run(fn, ...a){
  let res;
  try { res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args: a }) }); }
  catch (e) { throw new Error("無法連線到雲端，請檢查網路"); }
  let j; try { j = await res.json(); } catch (e) { throw new Error("雲端回應異常（請確認 Apps Script 已部署且存取權為「所有人」）"); }
  if (j.error) throw new Error(j.error);
  return j.result;
}
const em = e => (e && e.message) ? String(e.message).replace(/^Error:\s*/, "") : "發生錯誤";
function cloudChip(){
  const m = {
    off:  ["", "僅存本機"],
    out:  ["warn", "☁ 未登入雲端"],
    sync: ["info", "☁ 同步中…"],
    ok:   ["ok", "☁ 已同步" + (CL.last ? " " + CL.last.slice(11, 16) : "")],
    err:  ["bad", "☁ 同步失敗"],
    conflict: ["bad", "☁ 版本衝突"]
  }[CL.st] || ["", ""];
  const pend = CL.st === "out" && CL.dirty ? "・有未上傳變更" : "";
  return `<button class="sm ghost" data-act="cloudBtn" title="${esc(CL.msg)}"><span class="chip ${m[0]}" style="border:0;background:none;padding:0">${m[1]}${pend}</span></button>`;
}
function renderCloud(){ const el = $("#cloud"); if (el) el.innerHTML = cloudChip(); }
function schedulePush(){
  if (!CL.pw) { CL.st = "out"; renderCloud(); return; }
  clearTimeout(CL.timer); CL.timer = setTimeout(push, 1200);
}
async function push(force){
  if (!CL.pw) return;
  if (CL.busy) { schedulePush(); return; }
  CL.busy = true; CL.st = "sync"; renderCloud();
  const startEdits = CL.edits;
  try {
    const r = await run("adminSave", CL.pw, DB, CL.ver, !!force);
    setVer(r.ver); CL.last = r.time; CL.st = "ok"; CL.msg = "";
    if (CL.edits === startEdits) setDirty(false); else schedulePush();
  } catch (e) {
    const m = em(e);
    if (m === "CONFLICT") { CL.st = "conflict"; CL.msg = "雲端有較新的版本"; conflictSheet(); }
    else { CL.st = "err"; CL.msg = m; toast("雲端同步失敗：" + m); if (/密碼/.test(m)) { CL.pw = ""; lsSet("pgy-pw", ""); } }
  }
  CL.busy = false; renderCloud();
}
function applyCloudReplies(list){
  let n = 0;
  (list || []).filter(r => r.seq > (DB.replySeq || 0)).sort((a, b) => a.seq - b.seq).forEach(r => {
    DB.replySeq = Math.max(DB.replySeq || 0, r.seq);
    const x = session(r.sid); if (!x || ["done", "cancel"].includes(x.status)) return;
    if (r.ok) { x.status = "confirmed"; x.proposal = null; } else { x.status = "resched"; x.proposal = { date: r.date, start: r.start, end: r.end, note: r.note }; }
    if (r.note) x.note = (x.note ? x.note + "；" : "") + "導師：" + r.note;
    n++;
  });
  return n;
}
async function cloudLogin(pw, remember, quiet){
  CL.st = "sync"; CL.got = 0; renderCloud();
  let r;
  try { r = await run("adminLoad", pw); }
  catch (e) { CL.st = CL.pw ? "err" : "out"; CL.msg = em(e); renderCloud(); if (/密碼/.test(CL.msg)) lsSet("pgy-pw", ""); if (!quiet) toast(CL.msg); return false; }
  CL.pw = pw; if (remember) lsSet("pgy-pw", pw);
  if (!r.db) {
    setVer(r.ver); await push(); toast("雲端尚無資料，已將本機資料上傳");
  } else if (CL.dirty && CL.ver !== r.ver) {
    CL.cloud = r; CL.st = "conflict"; renderCloud(); conflictSheet(); return true;
  } else if (CL.dirty) {
    setVer(r.ver);
    const n = applyCloudReplies(r.replies); CL.got = n; if (n) { save(); toast(`收到 ${n} 筆導師回覆，已更新梯次狀態`); }
    await push();
  } else {
    DB = r.db; setVer(r.ver); save(true); setDirty(false);
    const n = applyCloudReplies(r.replies); CL.got = n;

/* PGY1 課程：PGY1 必修；PGY2 若未完成則列為補訓。PGY2 課程：PGY2 必修。 */
function required(s, c){
  if (!c.active) return false;
  if (c.level === "PGY1") return s.level === "PGY1" || s.level === "PGY2";
  if (c.level === "PGY2") return s.level === "PGY2";
  return false;
}
function eligible(s, c){ return required(s, c) || (c.ugy && s.level === "UGY"); }
function doneInfo(sid, cid){
  const r = DB.records.find(x => x.sid === sid && x.cid === cid);
  if (r) return { date: r.date, src: r.src || "匯入" };
  const ss = DB.sessions.filter(x => x.cid === cid && x.status === "done" && (x.attended || x.students).includes(sid)).sort((a, b) => a.date < b.date ? -1 : 1)[0];
  return ss ? { date: ss.date, src: "課程", ses: ss.id } : null;
}
function schedInfo(sid, cid, exceptSes){
  return DB.sessions.filter(x => x.cid === cid && x.id !== exceptSes && !["done", "cancel"].includes(x.status) && x.students.includes(sid)).sort((a, b) => a.date < b.date ? -1 : 1)[0] || null;
}
/* 學員對某課程的狀態 */
function cellState(s, c){
  if (!required(s, c)) return { k: "na" };
  const d = doneInfo(s.id, c.id); if (d) return { k: "done", d };
  const sc = schedInfo(s.id, c.id); if (sc) return { k: "sch", sc };
  const ended = s.end && s.end < TODAY;
  const soon = s.end && !ended && s.end <= addDays(TODAY, 90);
  return { k: (ended || soon) ? "late" : "miss", ended, soon };
}
function progress(s){
  const req = DB.courses.filter(c => required(s, c));
  let done = 0, sch = 0;
  req.forEach(c => { const k = cellState(s, c).k; if (k === "done") done++; else if (k === "sch") sch++; });
  return { total: req.length, done, sch, miss: req.length - done - sch };
}
function inTraining(s, from, to){ return (!s.start || s.start <= to) && (!s.end || s.end >= from); }
/* 某月份需要排某課程的學員（在訓、未完成、未排），依結訓日排序 */
function demand(c, month){
  const from = month + "-01", to = monthEnd(month);
  return DB.students.filter(s => required(s, c) && inTraining(s, from, to) && !doneInfo(s.id, c.id) && !schedInfo(s.id, c.id))
    .sort((a, b) => (a.end || "9999") < (b.end || "9999") ? -1 : 1);
}
const sortCourses = arr => arr.slice().sort((a, b) => (a.level > b.level ? 1 : a.level < b.level ? -1 : 0) || DB.courses.indexOf(a) - DB.courses.indexOf(b));

function progressHtml(){
  const q = S.pq.trim().toLowerCase();
  const cs = sortCourses(DB.courses.filter(c => c.active));
  let list = DB.students.filter(s => s.level !== "UGY" && (!S.lv || s.level === S.lv) && (!q || (s.name + s.id).toLowerCase().includes(q)));
  if (S.pc === "active") list = list.filter(s => inTraining(s, TODAY, TODAY));
  if (S.pc === "gap") list = list.filter(s => progress(s).miss > 0);
  if (S.pc === "late") list = list.filter(s => cs.some(c => cellState(s, c).k === "late"));
  list.sort((a, b) => a.level.localeCompare(b.level) || (a.end || "").localeCompare(b.end || ""));
  const cell = (s, c) => {
    const st = cellState(s, c);
    if (st.k === "na") return '<span class="cell na">·</span>';
    if (st.k === "done") return `<span class="cell done" title="完成 ${esc(st.d.date || "")}">✓${st.d.date ? " " + md(st.d.date) : ""}</span>`;
    if (st.k === "sch") return `<span class="cell sch" title="${esc(STATUS[st.sc.status].t)}">◷ ${md(st.sc.date)}</span>`;
    return `<span class="cell ${st.k}" title="${st.ended ? "已結訓未完成" : st.soon ? "90 天內結訓" : "未安排"}">${s.level === "PGY2" && c.level === "PGY1" ? "補" : "—"}</span>`;
  };
  const rows = list.map(s => { const p = progress(s);
    return `<tr class="click" data-act="stu" data-id="${esc(s.id)}"><td class="sticky">${esc(s.name)}</td><td>${lvPill(s.level)} <span class="meta">${s.end ? "至 " + esc(s.end) : ""}</span></td>${cs.map(c => `<td>${cell(s, c)}</td>`).join("")}<td><b>${p.done}</b>/${p.total}</td></tr>`; }).join("");
  return `<div class="card"><div class="row"><div class="row left"><input id="pq" class="inline" placeholder="搜尋學員" value="${esc(S.pq)}" style="width:170px">
      <select id="plv" class="inline">${["", "PGY1", "PGY2"].map(l => `<option value="${l}" ${l === S.lv ? "selected" : ""}>${l || "全部級別"}</option>`).join("")}</select>
      <select id="ppc" class="inline">${[["all","全部學員"],["active","目前在訓"],["gap","有未安排課程"],["late","即將/已結訓仍缺課"]].map(([k, t]) => `<option value="${k}" ${k === S.pc ? "selected" : ""}>${t}</option>`).join("")}</select><span class="meta">${list.length} 人</span></div>
      <button class="sm ghost" data-act="expProg">匯出進度表</button></div>
    <div class="legend"><span><span class="cell done">✓</span>已完成</span><span><span class="cell sch">◷</span>已排定</span><span><span class="cell miss">—</span>尚未安排</span><span><span class="cell miss">補</span>PGY2 補訓 PGY1 課程</span><span><span class="cell late">—</span>90 天內結訓或已結訓仍未完成</span><span><span class="cell na">·</span>不適用</span></div>
    <div class="scroll mx" style="margin-top:12px"><table><tr><th class="sticky">學員</th><th>級別</th>${cs.map(c => `<th class="v">${esc(c.name)}<br><span style="opacity:.6">${c.level}</span></th>`).join("")}<th>完成</th></tr>
    ${rows || `<tr><td colspan="${cs.length + 3}" class="empty">沒有符合條件的學員</td></tr>`}</table></div></div>`;
}

/* ================= 梯次編輯 ================= */
function openSession(s){
  E = JSON.parse(JSON.stringify(s)); E.showAll = false;
  drawSession();
}
function newSession(date, cid){
  const c = course(cid) || DB.courses.find(x => x.active) || DB.courses[0];
  if (!c) return toast("請先建立課程");
  openSession({ id: "", cid: c.id, date, start: c.start || "17:30", end: c.end || "19:30", place: c.place, instructor: c.instructor, status: "draft", students: [], attended: null, note: "", proposal: null });
}
function candList(){
  const c = course(E.cid); if (!c) return [];
  const from = E.date.slice(0, 7) + "-01", to = monthEnd(E.date.slice(0, 7));
  return DB.students.map(s => {
    const sel = E.students.includes(s.id), elig = eligible(s, c), done = doneInfo(s.id, c.id), other = schedInfo(s.id, c.id, E.id);
    const inT = inTraining(s, E.date, E.date);
    const need = required(s, c) && !done && !other;
    let rank = sel ? 0 : need && inT ? 1 : elig && !done && !other ? 2 : 3;
    return { s, sel, elig, done, other, inT, need, rank };
  }).filter(x => x.sel || E.showAll || (x.elig && !x.done && !x.other && inTraining(x.s, from, to)))
    .sort((a, b) => a.rank - b.rank || (a.s.end || "9999").localeCompare(b.s.end || "9999"));
}
function drawSession(){
  const c = course(E.cid) || {}, isDone = E.status === "done";
  const cands = candList();
  const items = cands.map(x => {
    const tags = [lvPill(x.s.level)];
    if (x.done) tags.push(`<span class="chip ok">已完成${x.done.date ? " " + md(x.done.date) : ""}</span>`);
    if (x.other) tags.push(`<span class="chip info">已排 ${md(x.other.date)}</span>`);
    if (!x.inT) tags.push('<span class="chip warn">當日不在訓</span>');
    if (x.s.level === "PGY2" && c.level === "PGY1" && x.need) tags.push('<span class="chip warn">補訓</span>');
    const att = isDone && x.sel ? `<label style="padding:0;border:0;gap:4px" class="meta"><input type="checkbox" data-att="${esc(x.s.id)}" ${(E.attended || E.students).includes(x.s.id) ? "checked" : ""}>出席</label>` : "";
    return `<label><input type="checkbox" data-pick="${esc(x.s.id)}" ${x.sel ? "checked" : ""}><span class="grow">${esc(x.s.name)} <span class="meta">${esc(x.s.id)}・訓至 ${esc(x.s.end || "?")}</span></span>${tags.join(" ")}${att}</label>`;
  }).join("");
  const prop = E.status === "resched" && E.proposal ? `<div class="note">導師建議改至 <b>${mdw(E.proposal.date)} ${esc(E.proposal.start)}${E.proposal.end ? "–" + esc(E.proposal.end) : ""}</b>${E.proposal.note ? "：" + esc(E.proposal.note) : ""}　<button type="button" class="xs" data-act="useProp">採用建議時間</button></div>` : "";
  sheet(`<h3>${E.id ? "編輯梯次" : "新增梯次"}</h3>${prop}
    <div class="grid g2"><div><label class="f">課程</label><select id="eC">${sortCourses(DB.courses).map(x => `<option value="${x.id}" ${x.id === E.cid ? "selected" : ""}>${x.level}｜${esc(x.name)}</option>`).join("")}</select></div>

    <div class="acts end"><button class="ghost" data-act="closeSheet">取消</button><button data-act="doPreplan">產生草擬梯次</button></div>`);

function doPreplan(){
  const m = S.month, wds = $$("[data-wd]").filter(x => x.checked).map(x => +x.dataset.wd);
  const from = $("#ppFrom").value || m + "-01", dS = $("#ppS").value, dE = $("#ppE").value;
  const dates = []; for (let d = m + "-01"; d <= monthEnd(m); d = addDays(d, 1)) if (d >= from && wds.includes(new Date(d + "T00:00").getDay())) dates.push(d);
  if (!dates.length) return toast("沒有可用日期，請調整星期或最早日期");
  const busy = {}; DB.sessions.filter(x => x.date.startsWith(m) && x.status !== "cancel").forEach(x => busy[x.date] = (busy[x.date] || 0) + 1);
  let made = 0, ci = 0;
  sortCourses(DB.courses.filter(c => c.active)).forEach(c => {
    const box = $(`[data-pp="${c.id}"]`); if (!box || !box.checked) return;
    const k = +($(`[data-ppn="${c.id}"]`).value || 0); if (!k) return;
    const need = demand(c, m);
    // 依日期均勻分布，並優先挑當天課程較少的日子
    for (let i = 0; i < k; i++) {
      const ideal = Math.min(dates.length - 1, Math.floor((i + 0.5) * dates.length / k) + ci % 2);
      const best = dates.map((d, j) => ({ d, sc: (busy[d] || 0) * 100 + Math.abs(j - ideal) })).sort((a, b) => a.sc - b.sc)[0].d;
      busy[best] = (busy[best] || 0) + 1;
      const size = c.cap ? c.cap : need.length;
      const grp = need.splice(0, size).map(s => s.id);
      DB.sessions.push({ id: uid(), cid: c.id, date: best, start: c.start || dS, end: c.end || dE, place: c.place, instructor: c.instructor, status: "draft", students: grp, attended: null, note: "", proposal: null });
      made++;
    }
    ci++;
  });
  save(); closeSheet(); S.sv = "cal"; render(); toast(made ? `已產生 ${made} 個草擬梯次` : "沒有產生任何梯次");
}

/* ================= 匯入 ================= */
function parseTable(text){
  const t = text.replace(/\r/g, "").trim(); if (!t) return [];
  const delim = t.split("\n")[0].includes("\t") ? "\t" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"' && cur === "") q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  row.push(cur); rows.push(row);
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
function matchCourse(name){
  const n = normName(name); if (!n) return null;
  return DB.courses.find(c => normName(c.name) === n) || DB.courses.find(c => normName(c.name).includes(n) || n.includes(normName(c.name))) || null;
}
function importStudents(text, replace){
  const rows = parseTable(text); if (!rows.length) return "沒有資料";
  const H = { id: /人事|員編|編號|工號|id/i, name: /姓名|名字|name/i, level: /級別|職級|年級|level/i, start: /開始|起|到職|start/i, end: /結束|迄|end/i, trained: /已訓|已完成|已上|訓練過|trained/i, note: /備註|note/i };
  let map = null;
  if (rows[0].some(h => H.name.test(h))) {
    map = {}; rows[0].forEach((h, i) => { for (const k in H) if (map[k] == null && H[k].test(h) && !(k === "start" && /結束|迄/.test(h))) { map[k] = i; break; } });
    rows.shift();
  } else map = { id: 0, name: 1, level: 2, start: 3, end: 4, trained: 5, note: 6 };
  if (replace) { DB.students = []; DB.records = DB.records.filter(r => r.src !== "匯入"); }
  let add = 0, upd = 0, recN = 0; const unk = new Set(), bad = [];
  rows.forEach((r, i) => {
    const g = k => map[k] != null ? (r[map[k]] || "").trim() : "";
    const id = g("id") || g("name"), name = g("name");
    if (!id || !name) { bad.push(i + 2); return; }
    let lv = g("level").toUpperCase().replace(/\s/g, ""); lv = /2/.test(lv) && /PGY/.test(lv) ? "PGY2" : /UGY|實習|見習/.test(lv) ? "UGY" : "PGY1";
    const o = { id, name, level: lv, start: normDate(g("start")), end: normDate(g("end")), note: g("note") };
    const ex = student(id);
    if (ex) { Object.assign(ex, Object.fromEntries(Object.entries(o).filter(([k, v]) => v || k === "level"))); upd++; } else { DB.students.push(o); add++; }
    g("trained").split(/[、,，;；|\n]+/).map(x => x.trim()).filter(Boolean).forEach(nm => {
      const dm = nm.match(/^(.*?)[\s(（]+(\d[\d\/.\-]+)\)?）?$/); const cn = dm ? dm[1] : nm, dt = dm ? normDate(dm[2]) : "";
      const c = matchCourse(cn); if (!c) { unk.add(cn); return; }
      if (!DB.records.some(x => x.sid === id && x.cid === c.id)) { DB.records.push({ sid: id, cid: c.id, date: dt, src: "匯入" }); recN++; }
    });
  });
  save();
  return `新增 ${add} 人、更新 ${upd} 人、登錄 ${recN} 筆已訓練紀錄。` + (unk.size ? `\n⚠ 無法對應的課程名稱：${[...unk].join("、")}（請先在「課程」建立或修正名稱後重新匯入）` : "") + (bad.length ? `\n⚠ 第 ${bad.join("、")} 列缺少人事號或姓名，已略過` : "");
}
function importRecords(text){
  const rows = parseTable(text); if (!rows.length) return "沒有資料";
  if (/人事|員編|姓名|課程/.test(rows[0].join(""))) rows.shift();
  let n = 0; const miss = [], unk = new Set();
  rows.forEach(r => {
    const s = student(r[0]) || DB.students.find(x => x.name === r[0]); if (!s) { miss.push(r[0]); return; }
    const c = matchCourse(r[1]); if (!c) { unk.add(r[1]); return; }
    const ex = DB.records.find(x => x.sid === s.id && x.cid === c.id);
    if (ex) { if (r[2]) ex.date = normDate(r[2]); } else { DB.records.push({ sid: s.id, cid: c.id, date: normDate(r[2]), src: "匯入" }); n++; }
  });
  save();
  return `新增 ${n} 筆紀錄。` + (miss.length ? `\n⚠ 找不到學員：${miss.join("、")}` : "") + (unk.size ? `\n⚠ 找不到課程：${[...unk].join("、")}` : "");
}

  if (id === "eC") { readSes(); const c = course(E.cid); if (c && !E.id) { E.place = c.place; if (c.instructor) E.instructor = c.instructor; if (c.start) { E.start = c.start; E.end = c.end; } } drawSession(); }
  if (id === "eSt" || id === "eD") { readSes(); if (E.status === "done" && !E.attended) E.attended = E.students.slice(); drawSession(); }

  if (id === "fileBak" && t.files[0]) { const r = new FileReader(); r.onload = async () => {

    r.readAsText(t.files[0], "utf-8"); }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target, fd = new FormData(f), g = k => String(fd.get(k) || "").trim();
  if (f.dataset.form === "cloud") {
    const pw = g("pw"), rem = !!fd.get("remember");
    f.querySelector("[type=submit]").disabled = true;
    cloudLogin(pw, rem).then(ok => { if (ok) { if (CL.st !== "conflict") { closeSheet(); toast("已登入雲端並同步"); } } else loginSheet(CL.msg); });
    return;
  }
  if (f.dataset.form === "course") {
    const o = { name: g("name"), level: g("level"), content: g("content"), place: g("place"), cap: Math.max(0, parseInt(g("cap")) || 0), capFlex: !!fd.get("capFlex"), audience: g("audience"), ugy: !!fd.get("ugy"), instructor: g("instructor"), start: g("start"), end: g("end"), note: g("note"), active: !!fd.get("active") };
    if (DB.courses.some(c => c.name === o.name && c.id !== g("id"))) return toast("已有同名課程");
    const ex = course(g("id")); if (ex) Object.assign(ex, o); else DB.courses.push(Object.assign({ id: uid() }, o));
    save(); closeSheet(); render(); toast("已儲存課程");
  }
  if (f.dataset.form === "student") {
    const orig = g("orig"), o = { id: g("id"), name: g("name"), level: g("level"), start: g("start"), end: g("end"), note: g("note") };
    if (o.id !== orig && student(o.id)) return toast("人事號已存在");
    const ex = student(orig);
    if (ex) { if (orig !== o.id) { DB.records.forEach(r => { if (r.sid === orig) r.sid = o.id; }); DB.sessions.forEach(x => { x.students = x.students.map(s => s === orig ? o.id : s); if (x.attended) x.attended = x.attended.map(s => s === orig ? o.id : s); }); } Object.assign(ex, o); }
    else DB.students.push(o);
    save(); closeSheet(); render(); toast("已儲存學員");
  }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "cOk" || a === "cNo") { const r = confirmRes; confirmRes = null; closeSheet(); if (r) r(a === "cOk"); return; }
  if (a === "closeSheet") return closeSheet();
  if (a === "cloudBtn") return cloudMenu();
  if (a === "cloudLogin") return loginSheet();
  if (a === "cloudSync") return cloudSync();
  if (a === "cloudOut") { CL.pw = ""; lsSet("pgy-pw", ""); CL.st = "out"; closeSheet(); render(); toast("已登出雲端（資料仍保留在本機）"); return; }
  if (a === "useCloud") { closeSheet(); setDirty(false); const pw = CL.pw; if (CL.cloud) { const r = CL.cloud; CL.cloud = null; DB = r.db; setVer(r.ver); save(true); const n = applyCloudReplies(r.replies); if (n) save(); CL.st = "ok"; render(); toast("已改用雲端版本"); } else await cloudLogin(pw, false); return; }
  if (a === "forceLocal") { closeSheet(); CL.cloud = null; await push(true); render(); if (CL.st === "ok") toast("已以本機資料覆蓋雲端"); return; }
  if (a === "tab") { closeSheet(); S.tab = t.dataset.v; render(); window.scrollTo(0, 0); return; }
  if (a === "sv") { S.sv = t.dataset.v; return render(); }
  if (a === "mon") { const [y, m] = S.month.split("-").map(Number), d = new Date(y, m - 1 + +t.dataset.d, 1); S.month = d.getFullYear() + "-" + p2(d.getMonth() + 1); return render(); }
  /* 梯次 */
  if (a === "editSes") { e.stopPropagation(); const x = session(id); if (x) openSession(x); return; }
  if (a === "newSes") { if (e.target.closest(".ev")) return; return newSession(t.dataset.date); }
  if (a === "autoFill") { readSes(); const c = course(E.cid); const room = c.cap ? Math.max(0, c.cap - E.students.length) : Infinity;
    const add = candList().filter(x => !x.sel && x.need && x.inT).slice(0, room).map(x => x.s.id); E.students = E.students.concat(add); if (E.attended) E.attended = E.attended.concat(add); drawSession(); toast(add.length ? `加入 ${add.length} 人` : "沒有可加入的待訓學員"); return; }
  if (a === "clearPick") { readSes(); E.students = []; if (E.attended) E.attended = []; return drawSession(); }
  if (a === "useProp") { readSes(); E.date = E.proposal.date || E.date; E.start = E.proposal.start || E.start; E.end = E.proposal.end || E.end; E.status = "confirmed"; E.proposal = null; drawSession(); toast("已套用建議時間，按儲存生效"); return; }
  if (a === "saveSes") { readSes(); if (!E.date) return toast("請填日期");
    const o = { id: E.id || uid(), cid: E.cid, date: E.date, start: E.start, end: E.end, place: E.place, instructor: E.instructor, status: E.status, students: E.students, attended: E.status === "done" ? (E.attended || E.students).filter(s => E.students.includes(s)) : null, note: E.note, proposal: E.status === "resched" ? E.proposal : null };
    const i = DB.sessions.findIndex(x => x.id === o.id); if (i >= 0) DB.sessions[i] = o; else DB.sessions.push(o);
    save(); closeSheet(); render(); toast("已儲存梯次"); return; }
  if (a === "delSes") { const sid = E.id; if (!(await ask("確定刪除此梯次？", "刪除"))) return; DB.sessions = DB.sessions.filter(x => x.id !== sid); save(); render(); toast("已刪除"); return; }
  if (a === "copySes") { readSes(); const c = course(E.cid) || {}; copyText(`${c.name}｜${mdw(E.date)} ${E.start}–${E.end}｜${E.place}｜導師：${E.instructor || "未定"}\n` + E.students.map((s, i) => `${i + 1}. ${(student(s) || {}).name || s}（${s}）`).join("\n"), "已複製名單"); return; }
  if (a === "preplan") return preplanForm();
  if (a === "doPreplan") return doPreplan();
  if (a === "sendAll") { const n = DB.sessions.filter(x => x.date.startsWith(S.month) && x.status === "draft"); n.forEach(x => x.status = "pending"); save(); render(); toast(n.length ? `${n.length} 個梯次改為待導師確認，請產生連結傳給導師` : "本月沒有草擬梯次"); return; }
  if (a === "teachLink") return teachLink(t.dataset.t);
  if (a === "copyTMsg") return copyText($("#tMsg").value, "已複製，請貼給導師");
  if (a === "applyReply") return applyReply();
  if (a === "mkReply") return mkReply();
  if (a === "copyReply") return copyText(window._R, "已複製，請傳回教學部");
  if (a === "expMonth") { const rows = [["日期","星期","開始","結束","課程","級別","地點","導師","狀態","人數","學員名單"]];
    DB.sessions.filter(x => x.date.startsWith(S.month)).sort((a, b) => (a.date + a.start) < (b.date + b.start) ? -1 : 1).forEach(x => { const c = course(x.cid) || {};
      rows.push([x.date, WD[new Date(x.date + "T00:00").getDay()], x.start, x.end, c.name, c.level, x.place, x.instructor, STATUS[x.status].t, x.students.length, x.students.map(s => (student(s) || {}).name || s).join("、")]); });
    download(`PGY課程_${S.month}.csv`, toCsv(rows)); return; }
  /* 課程 */
  if (a === "editCourse") { if (id) courseForm(course(id)); else courseForm(Object.assign({ id: "", name: "", level: t.dataset.lv || "PGY1", content: "", place: "", cap: 0, capFlex: false, audience: "", ugy: false, instructor: "", start: "", end: "", note: "", active: true })); return; }
  if (a === "mvCourse") { const i = DB.courses.findIndex(c => c.id === id), d = +t.dataset.d, lv = DB.courses[i].level; let j = i + d; while (j >= 0 && j < DB.courses.length && DB.courses[j].level !== lv) j += d; if (j < 0 || j >= DB.courses.length) return; [DB.courses[i], DB.courses[j]] = [DB.courses[j], DB.courses[i]]; save(); return render(); }
  if (a === "delCourse") { const c = course(id), n = DB.sessions.filter(x => x.cid === id).length; if (!(await ask(`刪除「${c.name}」？${n ? `相關 ${n} 個梯次與` : ""}訓練紀錄也會一併刪除。若只是暫停，建議改為「停用」。`, "刪除"))) return;
    DB.courses = DB.courses.filter(x => x.id !== id); DB.sessions = DB.sessions.filter(x => x.cid !== id); DB.records = DB.records.filter(x => x.cid !== id); save(); render(); return; }
  /* 學員 */
  if (a === "stu") return studentDetail(id);
  if (a === "stuForm") return studentForm();
  if (a === "stuEdit") return studentForm(student(id));
  if (a === "delStu") { if (!(await ask("確定刪除此學員及其訓練紀錄？", "刪除"))) return; DB.students = DB.students.filter(s => s.id !== id); DB.records = DB.records.filter(r => r.sid !== id); DB.sessions.forEach(x => { x.students = x.students.filter(s => s !== id); if (x.attended) x.attended = x.attended.filter(s => s !== id); }); save(); render(); return; }
  if (a === "addRec") { const d = prompt("完成日期（可空白，例 2026/9/10）", ""); if (d === null) return; DB.records.push({ sid: t.dataset.s, cid: t.dataset.c, date: normDate(d), src: "手動" }); save(); render(); return studentDetail(t.dataset.s); }
  if (a === "delRec") { DB.records = DB.records.filter(r => !(r.sid === t.dataset.s && r.cid === t.dataset.c)); save(); render(); return studentDetail(t.dataset.s); }
  if (a === "promote") { const list = DB.students.filter(s => s.level === "PGY1" && s.end && s.end < TODAY);
    if (!list.length) return toast("沒有已結束 PGY1 訓練期間的學員（請確認訓練結束日）");
    if (!(await ask(`將 ${list.length} 位 PGY1 訓練期滿的學員升為 PGY2？訓練期間會順延一年，已完成紀錄保留。`, "升級"))) return;
    list.forEach(s => { s.level = "PGY2"; s.start = addDays(s.end, 1); s.end = addDays(s.start.replace(/^\d{4}/, String(+s.start.slice(0, 4) + 1)), -1); }); save(); render(); toast(`已升級 ${list.length} 人`); return; }
  if (a === "expProg") { const cs = sortCourses(DB.courses.filter(c => c.active)); const rows = [["人事號","姓名","級別","訓練開始","訓練結束", ...cs.map(c => c.level + " " + c.name), "完成數","應修數","未安排"]];
    DB.students.filter(s => s.level !== "UGY").forEach(s => { const p = progress(s); rows.push([s.id, s.name, s.level, s.start, s.end, ...cs.map(c => { const st = cellState(s, c); return st.k === "na" ? "" : st.k === "done" ? "已完成 " + (st.d.date || "") : st.k === "sch" ? "已排 " + st.sc.date : "未安排"; }), p.done, p.total, p.miss]); });
    download(`PGY訓練進度_${TODAY}.csv`, toCsv(rows)); return; }

  if (a === "tplStu") { download("PGY學員名單範本.csv", toCsv([["人事號","姓名","級別","訓練開始","訓練結束","已訓練課程","備註"],["A12345","王小明","PGY1","2026/8/1","2027/7/31","急救、ALS_TRM",""],["A12346","林小華","PGY2","2025/8/1","2026/7/31","急救、CVC放置_echo",""]])); return; }
  if (a === "backup") { download(`PGY排課備份_${TODAY}.json`, JSON.stringify(DB, null, 1), "application/json"); toast("已匯出備份"); return; }

});
